<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Every route lives after the "#", but people type and share addresses
         without it: /admin, /login?next=%2Fprofile. The host sends those to
         this page (its rewrite rule, in docs/deploy-render.md), and this turns
         them into the route they mean, /#/admin, before anything reads the
         address. Changing the address in place keeps the page that is already
         loading. A file name (a dot in its last part, index.html included) is
         left alone. public/404.html does the same for a host that answers a
         missing page with it instead. -->
    <script>
      (function () {
        var path = window.location.pathname;
        if (path === "/" || /\.[^/]*$/.test(path)) return;
        window.history.replaceState(window.history.state, "", "/#" + path.replace(/\/+$/, "") + window.location.search);
      })();
    </script>
    <!-- viewport-fit=cover is what gives env(safe-area-inset-*) a real value,
         so the exam page's bottom action bar clears a phone's home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- For a phone's home screen, where an SVG icon is not used: the logo on
         white, square, since the phone rounds the corners itself. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f8fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07202f" />
    <!-- The saved theme, put on the page before anything is drawn. Left to
         React, the light background showed for the first frames of every load
         (over half a second on a slow phone) before turning dark. This reads
         the same storage key and fallback as src/lib/theme.ts, which keeps it
         up to date from then on; the two colours are its THEME_COLOURS. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem("examPeak.theme");
        } catch (error) {
          // Storage refused, as in some private windows: fall back below.
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        // Paints the browser's own background dark too, before the stylesheet arrives.
        root.style.colorScheme = theme;
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var index = 0; index < metas.length; index += 1) {
          metas[index].setAttribute("content", theme === "dark" ? "#07202f" : "#f4f8fc");
        }
      })();
    </script>
    <meta
      name="description"
      content="Exampeak generates Grade 9 mock tests from past-paper questions, marks them, and shows the right answer to every mistake."
    />
    <!-- The one address search engines should list the site under. Every
         page is this one address with a route after the "#", which they do
         not treat as a page of its own. -->
    <link rel="canonical" href="https://exampeak.onrender.com/" />
    <!-- What a link to the site shows when it is pasted into WhatsApp,
         Telegram and the like: the card in public/og-image.png, made from the
         logo and the landing page's own words. Open Graph wants absolute
         addresses, so the site's address is written out here; it is also in
         public/robots.txt and public/sitemap.xml, and docs/deploy-render.md
         lists everywhere to change it if the site moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Exampeak" />
    <meta property="og:title" content="Exampeak - Grade 9 mock tests" />
    <meta
      property="og:description"
      content="Build a Grade 9 mock test from past-paper questions, sit it start to finish, and see your score and every mistake, with the right answer, at the end."
    />
    <meta property="og:url" content="https://exampeak.onrender.com/" />
    <meta property="og:image" content="https://exampeak.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Exampeak. Grade 9 exam preparation: reach your peak." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://exampeak.onrender.com/og-image.png" />
    <meta name="twitter:image:alt" content="Exampeak. Grade 9 exam preparation: reach your peak." />
    <title>Exampeak - Grade 9 mock tests</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
