<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what gives env(safe-area-inset-*) a real value,
         so the exam page's bottom action bar clears a phone's home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f8fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07202f" />
    <meta
      name="description"
      content="Exampeak generates Grade 9 mock tests from past-paper questions, marks them, and explains every mistake."
    />
    <title>Exampeak - Grade 9 mock tests</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
