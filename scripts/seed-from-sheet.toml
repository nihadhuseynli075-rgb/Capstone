# Hand-written content for scripts/seed-from-sheet.py.
#
# The workbook is the source for everything it has. This file holds what it
# does not: Russian Language questions put into Russian, the Russian wording of
# the 26 April maths, marking guides, small fixes, and why a question is held
# back. One table per question, named by its external_ref.
#
# Keys (all optional):
#   prompt     replaces the question text (Russian Language: the Russian text)
#   options    replaces the options, same order A-E as the sheet
#   translated true when prompt/options were translated by machine (REVIEW.md
#              then asks Nihad to check it)
#   guide      marking guide for an open-ended question (goes in correct_answer)
#   ru_prompt / ru_options / ru_answer
#              maths only: the Russian version, stored in translations.ru.
#              ru_options and ru_answer are worked out from the English (4.5 ->
#              4,5, cm -> см, (4, 1) -> (4; 1)) unless given here.
#   status     "draft" to hold a question back; needs `missing`
#   missing    why it is a draft: what Nihad has to supply
#   check      something to look over even though the question is ready
#
# Quoted Russian words, sentences and options from the paper are kept exactly
# as Nihad typed them.

